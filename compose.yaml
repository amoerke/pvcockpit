# Startet die App als Container. Supabase läuft extern (self-hosted), daher
# gibt es hier nur den Web-Dienst.
#
# Compose liest standardmäßig `.env`, nicht `.env.local`. Deshalb:
#   docker compose --env-file .env.local up --build
services:
  web:
    build:
      context: .
      # Werte werden beim Build ins Browser-JavaScript eingebacken
      # (NEXT_PUBLIC_), eine spätere Änderung erfordert `--build`.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    # Geheimnisse erst zur LAUFZEIT: Sie stehen nicht im Image, sondern nur
    # im laufenden Container. Ändern = Container neu starten, kein --build.
    # Bewusst einzeln aufgezählt statt `env_file: .env.local` – sonst kämen
    # auch die E2E-Passwörter in den Container.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    ports:
      - "3000:3000"
    restart: unless-stopped
